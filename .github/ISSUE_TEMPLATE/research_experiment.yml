name: Research & Experiment Discussion
description: Propose or discuss experimental methodology, benchmark protocols, or telemetry observations.
title: "[RESEARCH]: "
labels: ["research"]
body:
  - type: input
    id: experiment_suite
    attributes:
      label: Experiment Suite
      description: Specific experiment referenced.
      placeholder: "e.g. Exp 2 (Stress Testing), Exp 3 (Ring Buffer Saturation), Exp 5 (Overhead)"
    validations:
      required: true
  - type: textarea
    id: methodology
    attributes:
      label: Research Discussion or Proposed Replication
      description: Detailed technical discussion of measurement methodology or findings.
    validations:
      required: true
